{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SplitCash — Expenses & Cashback</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" crossorigin="anonymous" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet" />
  <style>
    body { background:#f6f8fb; }
    .navbar-brand { font-weight:700; letter-spacing:-.02em; }
    .card { border:0; box-shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06); }
    .net-pos { color:#0a7d34; font-weight:600; }
    .net-neg { color:#c02434; font-weight:600; }
    .clickable { cursor:pointer; }
    .badge-soft { background:#eef2ff; color:#3538cd; }
    .list-group-item { border-color:#eef1f5; }
    .app-shell { max-width:1100px; }
    .spinner-center { display:flex; justify-content:center; padding:3rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel via CDN (no build step; usability-first internal tool). -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="{% static 'app/app.js' %}"></script>
</body>
</html>
