<!-- Simple SVG icon for CalorieTracker -->
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#grad1)"/>
  
  <!-- Plate -->
  <circle cx="96" cy="96" r="60" fill="white" opacity="0.9"/>
  <circle cx="96" cy="96" r="55" fill="none" stroke="#667eea" stroke-width="2"/>
  
  <!-- Food items -->
  <circle cx="80" cy="85" r="8" fill="#ff6b6b"/>
  <circle cx="110" cy="80" r="6" fill="#4ecdc4"/>
  <circle cx="105" cy="105" r="7" fill="#45b7d1"/>
  <circle cx="85" cy="110" r="5" fill="#96ceb4"/>
  
  <!-- Fork -->
  <path d="M140 60 L140 75 M135 60 L135 75 M145 60 L145 75 M140 75 L140 85" 
        stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Calories text -->
  <text x="96" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CALORIES</text>
</svg>